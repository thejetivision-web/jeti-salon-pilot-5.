
<style>
/* J.E.T.I. VISION — PINK VANITY SALON EDITION */

:root {
  --pink: #ef9fc5;
  --rose: #bd648e;
  --pale: #ffe4f1;
}

body {
  background: radial-gradient(
    ellipse at top,
    #392235,
    #08080a 75%
  );
}

.app {
  width: min(100%, 1180px) !important;
  padding: 18px 12px 36px;
}

.vanity-title {
  text-align: center;
  color: #ffe0ef;
  font-size: clamp(19px, 3vw, 30px);
  letter-spacing: 4px;
  margin: 10px 0 4px;
}

.vanity-subtitle {
  text-align: center;
  color: #e5b5ce;
  letter-spacing: 2px;
  font-size: 11px;
  margin-bottom: 22px;
}

.vanity-layout {
  display: grid;
  grid-template-columns:
    minmax(145px, 1fr)
    minmax(270px, 2.2fr)
    minmax(145px, 1fr);
  gap: 12px;
  align-items: stretch;
}

.vanity-side {
  background: linear-gradient(
    145deg,
    #ffe3f0,
    #df91b8 45%,
    #b65c89 75%,
    #fbd4e7
  );
  border: 3px solid #ffe0ee;
  border-radius: 24px;
  padding: 14px;
  color: #48253b;
  box-shadow:
    0 0 22px #f78ac455,
    inset 0 0 15px #ffffff88;
}

.vanity-side h2 {
  text-align: center;
  font-size: 13px;
  letter-spacing: 1px;
  margin: 8px 0 18px;
}

.vanity-side .adjustments {
  display: block !important;
  margin: 0;
  padding: 12px;
  background: #fff1f8dd;
  color: #44253a;
}

.vanity-side .slider {
  margin-bottom: 15px;
}

.vanity-side .slider label {
  display: block;
  font-size: 11px;
  line-height: 1.6;
}

.vanity-side .slider label span {
  display: block;
  font-weight: bold;
}

.vanity-side .slider input {
  width: 100%;
  accent-color: #b54c84;
}

.vanity-side button {
  width: 100%;
  margin: 5px 0;
  background: #713b5a;
  color: white;
}

.vanity-frame {
  position: relative;
  padding: 24px;
  border: 7px solid #f8c8df;
  border-radius: 36px;
  background: linear-gradient(
    135deg,
    #fff1f8,
    #d875a7 30%,
    #ffe3f1 60%,
    #a94979
  );
  box-shadow:
    0 0 0 3px #a34e7d,
    0 0 35px #ff8fc5aa,
    inset 0 0 20px #ffffff;
}

.vanity-frame::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 2px dotted #fff5cf;
  border-radius: 28px;
  pointer-events: none;
}

.vanity-frame::after {
  content: "✦ ✧ ✦";
  position: absolute;
  top: 3px;
  left: 50%;
  transform: translateX(-50%);
  color: #fffbdc;
  text-shadow: 0 0 10px white;
  animation: jetiSparkle 3s infinite alternate;
  pointer-events: none;
}

@keyframes jetiSparkle {
  from { opacity: 0.4; }
  to { opacity: 1; }
}

.vanity-frame .mirror {
  width: 100%;
  aspect-ratio: 3 / 4;
  border: 3px solid #fff3fa;
  border-radius: 18px;
  overflow: hidden;
}

.vanity-lights {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.vanity-bulb {
  position: absolute;
  width: 13px;
  height: 13px;
  background: #fff8df;
  border: 2px solid white;
  border-radius: 50%;
  box-shadow:
    0 0 8px 3px #fff5d0,
    0 0 17px 6px #ffb7dc;
}

.vanity-bulb.left { left: 4px; }
.vanity-bulb.right { right: 4px; }

.vanity-bulb:nth-child(1),
.vanity-bulb:nth-child(6) { top: 13%; }

.vanity-bulb:nth-child(2),
.vanity-bulb:nth-child(7) { top: 31%; }

.vanity-bulb:nth-child(3),
.vanity-bulb:nth-child(8) { top: 49%; }

.vanity-bulb:nth-child(4),
.vanity-bulb:nth-child(9) { top: 67%; }

.vanity-bulb:nth-child(5),
.vanity-bulb:nth-child(10) { top: 85%; }

.jeti-book {
  padding: 16px 8px;
  border: 2px solid #ffe4f0;
  background: #713657 !important;
  color: white !important;
  box-shadow: 0 4px 15px #7a315c66;
  font-size: 12px;
}

.booking-note {
  font-size: 12px;
  line-height: 1.6;
  text-align: center;
}

.vanity-layout #btnAdjust {
  display: none;
}

@media (max-width: 700px) {
  .app {
    padding: 10px 5px;
  }

  .vanity-layout {
    grid-template-columns:
      minmax(76px, 1fr)
      minmax(160px, 2.7fr)
      minmax(76px, 1fr);
    gap: 4px;
  }

  .vanity-side {
    padding: 5px 3px;
    border-width: 2px;
    border-radius: 12px;
  }

  .vanity-side h2 {
    font-size: 9px;
    margin: 7px 0;
  }

  .vanity-side .adjustments {
    padding: 4px;
  }

  .vanity-side .slider label,
  .booking-note {
    font-size: 9px;
  }

  .vanity-side button {
    font-size: 9px;
    padding: 8px 2px;
  }

  .vanity-frame {
    padding: 14px 9px;
    border-width: 4px;
    border-radius: 19px;
  }

  .vanity-frame .mirror {
    border-radius: 10px;
  }

  .vanity-bulb {
    width: 7px;
    height: 7px;
    border-width: 1px;
  }

  .vanity-bulb.left { left: 0; }
  .vanity-bulb.right { right: 0; }

  .buttons {
    flex-wrap: wrap;
  }

  .buttons button {
    flex: 1 1 40%;
  }

  .brand {
    font-size: 9px;
    letter-spacing: 1px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .vanity-frame::after {
    animation: none;
  }
}
</style>

<script>
/* Upgrade the existing J.E.T.I. interface.
   Keep the original camera and tracking code. */

(function () {
  const app = document.querySelector(".app");
  const mirror = document.getElementById("mirror");
  const panel = document.querySelector(".panel");
  const adjustments =
    document.getElementById("adjustments");
  const adjustButton =
    document.getElementById("btnAdjust");

  if (!app || !mirror || !panel || !adjustments) {
    return;
  }

  // Add salon branding.
  const title = document.createElement("h1");
  title.className = "vanity-title";
  title.textContent = "J.E.T.I. VISION";

  const subtitle = document.createElement("div");
  subtitle.className = "vanity-subtitle";
  subtitle.textContent =
    "ENVISION. OWN. ✦ SALON EDITION";

  app.prepend(subtitle);
  app.prepend(title);

  // Create three-column vanity layout.
  const layout = document.createElement("div");
  layout.className = "vanity-layout";

  const left = document.createElement("aside");
  left.className = "vanity-side";
  left.setAttribute(
    "aria-label",
    "Hairstyle adjustment controls"
  );

  const leftHeading = document.createElement("h2");
  leftHeading.textContent = "✦ ADJUST YOUR LOOK";
  left.appendChild(leftHeading);

  // Move the original working adjustment sliders.
  left.appendChild(adjustments);

  const frame = document.createElement("div");
  frame.className = "vanity-frame";

  // Add Hollywood-style vanity bulbs.
  const lights = document.createElement("div");
  lights.className = "vanity-lights";
  lights.setAttribute("aria-hidden", "true");

  for (let i = 0; i < 10; i++) {
    const bulb = document.createElement("i");
    bulb.className =
      "vanity-bulb " + (i < 5 ? "left" : "right");
    lights.appendChild(bulb);
  }

  frame.appendChild(lights);
  frame.appendChild(mirror);

  const right = document.createElement("aside");
  right.className = "vanity-side";
  right.setAttribute(
    "aria-label",
    "Salon booking"
  );

  const rightHeading = document.createElement("h2");
  rightHeading.textContent = "✦ LOVE YOUR LOOK?";

  const message = document.createElement("p");
  message.className = "booking-note";
  message.textContent =
    "Choose your hairstyle before your appointment.";

  const bookButton = document.createElement("button");
  bookButton.id = "btnBook";
  bookButton.className = "jeti-book";
  bookButton.type = "button";
  bookButton.textContent = "BOOK THIS LOOK ♡";

  const note = document.createElement("p");
  note.className = "booking-note";
  note.textContent =
    "Salon booking link coming with the pilot.";

  right.appendChild(rightHeading);
  right.appendChild(message);
  right.appendChild(bookButton);
  right.appendChild(note);

  layout.appendChild(left);
  layout.appendChild(frame);
  layout.appendChild(right);

  // Insert vanity above hairstyle selection.
  app.insertBefore(layout, panel);

  // Keep adjustment sliders visible at all times.
  adjustments.classList.add("open");

  if (adjustButton) {
    adjustButton.style.display = "none";
  }

  // Booking is a demo placeholder until the salon
  // provides its actual appointment booking URL.
  bookButton.addEventListener("click", function () {
    const status = document.getElementById("status");

    if (status) {
      status.textContent =
        "Booking will be available when the salon's appointment link is connected.";
    }
  });

  // Refresh hairstyle alignment after layout change.
  window.dispatchEvent(new Event("resize"));
})();
</script>
